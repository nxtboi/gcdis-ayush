# ==============================================================================
# Common upstream proxy settings (included in every location{} that proxies).
# nginx is the internet edge: it SETS client-address headers from $remote_addr
# and never forwards client-supplied X-Forwarded-For / X-Real-IP values.
# The API uses Express `trust proxy = 1`, i.e. it trusts exactly this one hop.
# ==============================================================================
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;
