# ==============================================================================
# Upstream headers that nginx replaces with its own (security-headers.conf), so
# browsers never receive duplicated / conflicting values.
#
# Content-Security-Policy is deliberately NOT in this list: the web and admin apps
# send a per-request nonce CSP that must reach the browser untouched. Only the API
# host hides the upstream CSP (and sets its own) - see nginx.conf.
#
# Cross-Origin-Resource-Policy is NOT in this list either: the API sends CORP on
# uploaded files and the web / admin apps may send their own. On www / admin nginx
# adds `same-site` only as a fallback when the upstream sent none (the
# $gcdis_corp_fallback map in nginx.conf), so the header is never duplicated.
#
# proxy_hide_header is an array directive: a block that declares any
# proxy_hide_header stops inheriting the http-level list, so blocks that need an
# extra entry must include this file again.
# ==============================================================================
proxy_hide_header X-Powered-By;
proxy_hide_header Server;
proxy_hide_header Strict-Transport-Security;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header X-Frame-Options;
proxy_hide_header Referrer-Policy;
proxy_hide_header Permissions-Policy;
proxy_hide_header Cross-Origin-Opener-Policy;
proxy_hide_header X-XSS-Protection;
