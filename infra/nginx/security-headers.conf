# ==============================================================================
# Baseline security headers for every TLS server block (single source of truth).
# Included at server{} level in nginx.conf.
#
# NOTE: nginx drops inherited add_header directives in any block that declares
# its own add_header, so never use add_header inside a location{} - put
# server-specific headers (API CSP, X-Robots-Tag) at server level next to the include.
#
# Content-Security-Policy is NOT set here: www and admin send their own per-request
# nonce CSP (adding a second policy would intersect with it and break the nonces);
# the API server block sets a static CSP itself.
# Cross-Origin-Resource-Policy is NOT set here either (the API sends its own per
# response); www / admin add a fallback-only CORP at server level (nginx.conf).
#
# Every add_header uses `always`, so the headers are also sent on 4xx/5xx responses
# (including nginx's own 429 rate-limit replies).
# ==============================================================================
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
# Value comes from the $gcdis_referrer_policy map in nginx.conf: no-referrer on the
# pages that carry one-time tokens in the URL, strict-origin-when-cross-origin elsewhere.
add_header Referrer-Policy $gcdis_referrer_policy always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), usb=(), serial=(), hid=(), bluetooth=(), browsing-topics=()" always;
# same-origin-allow-popups (not same-origin) is required by the Sign in with Google popup on /portal.
add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
