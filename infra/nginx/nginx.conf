user nginx;
worker_processes auto;
pid /tmp/nginx.pid;

events {
  worker_connections 2048;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # Hide Nginx version banner
  server_tokens off;

  # Writable paths live on tmpfs (the container root filesystem is read-only)
  client_body_temp_path /var/cache/nginx/client_temp;
  proxy_temp_path       /var/cache/nginx/proxy_temp;
  fastcgi_temp_path     /var/cache/nginx/fastcgi_temp;
  uwsgi_temp_path       /var/cache/nginx/uwsgi_temp;
  scgi_temp_path        /var/cache/nginx/scgi_temp;

  # Gzip compression
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

  # Client IP handling: this nginx IS the internet edge (ports 80/443 are published
  # directly), so there is no trusted upstream proxy. We deliberately do NOT use
  # set_real_ip_from / real_ip_header: trusting X-Forwarded-For here would let any
  # client spoof its address and bypass the per-IP rate limits below. Upstreams get
  # X-Real-IP / X-Forwarded-For set from $remote_addr (see proxy-params.conf).
  # If a CDN/load balancer is ever placed in front, add set_real_ip_from for ITS
  # published egress ranges only (never RFC1918 / docker ranges).

  # Rate Limiting & Connection Limiting Zones (keyed on the real TCP peer address).
  # The API applies its own per-account / per-email limits on top of these.
  limit_req_zone $binary_remote_addr zone=api_general:10m rate=30r/s;
  # Sign-in / sign-up (password, Google, 2FA login step)
  limit_req_zone $binary_remote_addr zone=api_auth:10m rate=10r/m;
  # Account-recovery and token endpoints (forgot/reset password, email verification,
  # resend verification, step-up re-authentication): slower still
  limit_req_zone $binary_remote_addr zone=api_auth_recovery:10m rate=5r/m;
  limit_req_zone $binary_remote_addr zone=api_auth_refresh:10m rate=30r/m;
  # Server-rendered pages on www / admin (HTML, RSC payloads). Every request here
  # costs a Next.js render, so cap it per IP; static assets (/_next/static, /images,
  # /_next/image) are served from their own locations without this limit. Used as
  # `limit_req zone=html_ssr burst=40 nodelay;` (a normal page load is a handful of
  # requests; prefetching a whole nav menu stays well inside the burst).
  limit_req_zone $binary_remote_addr zone=html_ssr:10m rate=20r/s;
  limit_conn_zone $binary_remote_addr zone=conn_limit:10m;
  limit_req_status 429;
  limit_conn_status 429;

  # Request size / time limits (slow-loris and oversized-request protection)
  # 10M default = the largest JSON body the API accepts (express body parsers in
  # apps/api/src; the API enforces its own, possibly smaller, per-route limits).
  # Only /api/uploads raises it (25M, the upload interceptor's fileSize limit; the
  # multipart route /api/uploads/stream alone allows 64M for the championship hero
  # video, EVENT_VIDEO, UPLOAD_VIDEO_MAX_MB default 60); the
  # www / admin hosts lower it to 1M (no uploads go through Next.js: the browser posts
  # files straight to api.gcdis.in).
  client_max_body_size        10M;
  client_body_buffer_size     128k;
  client_header_buffer_size   1k;
  large_client_header_buffers 4 16k;
  client_body_timeout         15s;
  client_header_timeout       15s;
  send_timeout                30s;
  keepalive_timeout           30s;
  keepalive_requests          1000;
  reset_timedout_connection   on;

  # Upstream timeouts (the WebSocket location raises proxy_read_timeout)
  proxy_connect_timeout 5s;
  proxy_send_timeout    60s;
  proxy_read_timeout    60s;

  # TLS (Mozilla "intermediate": TLS 1.2 + 1.3, AEAD/forward-secret suites only).
  # With only strong suites enabled the client's preference is used (prefer off),
  # which lets mobile clients without AES hardware pick ChaCha20.
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
  ssl_prefer_server_ciphers off;
  ssl_ecdh_curve      X25519:prime256v1:secp384r1;
  ssl_session_cache   shared:SSL:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;

  # OCSP stapling. chain.pem is written by certbot (and by infra/ssl/init-certs.sh for
  # the bootstrap certificate). Certificates without an OCSP responder URL (Let's
  # Encrypt stopped including one in 2025) simply are not stapled; nginx logs a
  # warning and serves normally. 127.0.0.11 is Docker's embedded DNS resolver.
  ssl_stapling        on;
  ssl_stapling_verify on;
  resolver            127.0.0.11 valid=300s ipv6=off;
  resolver_timeout    5s;

  # Upstream security headers are replaced by nginx's own (see file for the CSP rule)
  include /etc/nginx/proxy-hide-headers.conf;

  # Referrer-Policy per path (used by security-headers.conf). The password-reset and
  # email-verification pages carry one-time tokens in the query string
  # (/portal/reset-password?token=..., /portal/verify-email?token=...), so they must
  # never leak via Referer: no-referrer there. Implemented as a map rather than a
  # dedicated location{} so the header cannot be lost to add_header inheritance and
  # the page keeps every other security header and the upstream nonce CSP.
  map $uri $gcdis_referrer_policy {
    default                                            "strict-origin-when-cross-origin";
    ~^/portal/(verify-email|reset-password)/?$         "no-referrer";
  }

  # Cross-Origin-Resource-Policy fallback for www / admin. The Next.js apps are
  # expected to send CORP themselves; this map yields "same-site" ONLY when the
  # upstream response has no CORP header, and an empty value otherwise. add_header
  # skips empty values, so the browser never receives two CORP headers and the
  # app's own value always wins (CORP is therefore NOT in proxy-hide-headers.conf).
  map $upstream_http_cross_origin_resource_policy $gcdis_corp_fallback {
    ""      "same-site";
    default "";
  }

  # WebSocket upgrade helper
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # 1. HTTP -> HTTPS Redirect & ACME Challenge
  server {
    listen 80 default_server;
    server_name www.gcdis.in gcdis.in admin.gcdis.in api.gcdis.in;

    # Certbot challenge path (http-01 webroot, see infra/ssl/issue-certs.sh)
    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    # Container healthcheck endpoint (plain HTTP, no redirect)
    location = /healthz {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  # 1b. Reject TLS for unknown Host/SNI values instead of serving the public site
  server {
    listen 443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
  }

  # 2a. Apex -> www canonical redirect (the API CORS/CSRF allow-list contains the
  #     www origin only, so the site must not be served from the apex directly)
  server {
    listen 443 ssl;
    http2 on;
    server_name gcdis.in;

    ssl_certificate         /etc/nginx/ssl/live/gcdis.in/fullchain.pem;
    ssl_certificate_key     /etc/nginx/ssl/live/gcdis.in/privkey.pem;
    ssl_trusted_certificate /etc/nginx/ssl/live/gcdis.in/chain.pem;

    include /etc/nginx/security-headers.conf;
    include /etc/nginx/well-known.conf;

    location / {
      return 301 https://www.gcdis.in$request_uri;
    }
  }

  # 2. Public Institutional Website (www.gcdis.in)
  #    No Content-Security-Policy here: the Next.js middleware sends a per-request
  #    nonce CSP; a second (nginx) policy would be intersected with it and block
  #    the nonce'd scripts.
  server {
    listen 443 ssl;
    http2 on;
    server_name www.gcdis.in;

    ssl_certificate         /etc/nginx/ssl/live/gcdis.in/fullchain.pem;
    ssl_certificate_key     /etc/nginx/ssl/live/gcdis.in/privkey.pem;
    ssl_trusted_certificate /etc/nginx/ssl/live/gcdis.in/chain.pem;

    include /etc/nginx/security-headers.conf;
    # CORP only when the app did not send one (see the $gcdis_corp_fallback map)
    add_header Cross-Origin-Resource-Policy $gcdis_corp_fallback always;
    include /etc/nginx/well-known.conf;

    limit_conn conn_limit 30;
    # No forms or uploads are posted to Next.js (uploads go to api.gcdis.in)
    client_max_body_size 1M;

    # Server-rendered pages: per-IP request rate limit (html_ssr zone)
    location / {
      limit_req zone=html_ssr burst=40 nodelay;
      proxy_pass http://gcdis-web:3000;
      include /etc/nginx/proxy-params.conf;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }

    # Static assets: hashed build output, public images and the image optimizer
    # (a gallery page loads dozens at once) are exempt from the html_ssr limit;
    # limit_conn still applies. ^~ stops regex locations from taking them over.
    location ^~ /_next/static/ {
      proxy_pass http://gcdis-web:3000;
      include /etc/nginx/proxy-params.conf;
    }

    location ^~ /_next/image {
      proxy_pass http://gcdis-web:3000;
      include /etc/nginx/proxy-params.conf;
    }

    location ^~ /images/ {
      proxy_pass http://gcdis-web:3000;
      include /etc/nginx/proxy-params.conf;
    }
  }

  # 3. Dedicated Staff Admin Console (admin.gcdis.in)
  #    No Content-Security-Policy here either (nonce CSP from the admin middleware).
  server {
    listen 443 ssl;
    http2 on;
    server_name admin.gcdis.in;

    ssl_certificate         /etc/nginx/ssl/live/gcdis.in/fullchain.pem;
    ssl_certificate_key     /etc/nginx/ssl/live/gcdis.in/privkey.pem;
    ssl_trusted_certificate /etc/nginx/ssl/live/gcdis.in/chain.pem;

    # Optional source-IP allowlist (default: allow all; see file for usage)
    include /etc/nginx/admin-allowlist.conf;

    include /etc/nginx/security-headers.conf;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    # CORP only when the app did not send one (see the $gcdis_corp_fallback map)
    add_header Cross-Origin-Resource-Policy $gcdis_corp_fallback always;
    include /etc/nginx/well-known.conf;

    limit_conn conn_limit 20;
    # No forms or uploads are posted to Next.js (uploads go to api.gcdis.in)
    client_max_body_size 1M;

    # Server-rendered pages: per-IP request rate limit (html_ssr zone)
    location / {
      limit_req zone=html_ssr burst=40 nodelay;
      proxy_pass http://gcdis-admin:3001;
      include /etc/nginx/proxy-params.conf;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }

    # Static assets: exempt from the html_ssr limit (limit_conn still applies)
    location ^~ /_next/static/ {
      proxy_pass http://gcdis-admin:3001;
      include /etc/nginx/proxy-params.conf;
    }

    location ^~ /_next/image {
      proxy_pass http://gcdis-admin:3001;
      include /etc/nginx/proxy-params.conf;
    }
  }

  # 4. Core API & Live Telemetry WebSocket Service (api.gcdis.in)
  server {
    listen 443 ssl;
    http2 on;
    server_name api.gcdis.in;

    ssl_certificate         /etc/nginx/ssl/live/gcdis.in/fullchain.pem;
    ssl_certificate_key     /etc/nginx/ssl/live/gcdis.in/privkey.pem;
    ssl_trusted_certificate /etc/nginx/ssl/live/gcdis.in/chain.pem;

    include /etc/nginx/security-headers.conf;
    # JSON API: nothing may execute or be framed. nginx owns this host's CSP, so the
    # upstream copy (helmet) is hidden; the shared hide-list must be re-included
    # because declaring proxy_hide_header here stops http-level inheritance.
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
    include /etc/nginx/proxy-hide-headers.conf;
    proxy_hide_header Content-Security-Policy;
    include /etc/nginx/well-known.conf;

    limit_conn conn_limit 50;

    # Default API endpoint with general rate limiting
    location / {
      limit_req zone=api_general burst=60 nodelay;
      proxy_pass http://gcdis-api:4000;
      include /etc/nginx/proxy-params.conf;
    }

    # Strict rate limiting on sign-in endpoints (credential stuffing / enumeration)
    location ~ ^/api/auth/(login|register|google|2fa/verify-login)$ {
      limit_req zone=api_auth burst=10 nodelay;
      proxy_pass http://gcdis-api:4000;
      include /etc/nginx/proxy-params.conf;
    }

    # Account recovery, email verification and re-authentication
    location ~ ^/api/auth/(forgot-password|reset-password|verify-email|resend-verification|step-up|change-password|password-reset|password/) {
      limit_req zone=api_auth_recovery burst=5 nodelay;
      proxy_pass http://gcdis-api:4000;
      include /etc/nginx/proxy-params.conf;
    }

    # 2FA enrolment (TOTP brute-force protection)
    location ~ ^/api/auth/2fa/ {
      limit_req zone=api_auth burst=10 nodelay;
      proxy_pass http://gcdis-api:4000;
      include /etc/nginx/proxy-params.conf;
    }

    # Token refresh: frequent but bounded
    location = /api/auth/refresh {
      limit_req zone=api_auth_refresh burst=10 nodelay;
      proxy_pass http://gcdis-api:4000;
      include /etc/nginx/proxy-params.conf;
    }

    # High body limit allowed for multipart file uploads (up to 25MB)
    # (prefix without trailing slash: covers POST /api/uploads and /api/uploads/stream)
    location /api/uploads {
      client_max_body_size 25M;
      client_body_timeout 60s;
      limit_req zone=api_general burst=20 nodelay;
      proxy_pass http://gcdis-api:4000;
      include /etc/nginx/proxy-params.conf;
    }

    # Multipart uploads: 64M on this exact route only, for the administrator-only
    # championship hero video (EVENT_VIDEO, UPLOAD_VIDEO_MAX_MB default 60 MB plus
    # multipart overhead). The API still enforces 25 MB for every other purpose
    # (multer limit chosen per request before the body is read).
    location = /api/uploads/stream {
      client_max_body_size 64M;
      client_body_timeout 60s;
      proxy_read_timeout 120s;
      limit_req zone=api_general burst=20 nodelay;
      proxy_pass http://gcdis-api:4000;
      include /etc/nginx/proxy-params.conf;
    }

    # WebSocket scoring channel (high-concurrency connection handling)
    location /socket.io/ {
      limit_req zone=api_general burst=60 nodelay;
      proxy_pass http://gcdis-api:4000;
      include /etc/nginx/proxy-params.conf;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 86400s;
    }
  }
}
