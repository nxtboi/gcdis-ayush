# ==============================================================================
# RFC 9116 security.txt, served on every public TLS host (included at server level).
# Source: infra/nginx/security.txt - renew the Expires field before it lapses
# (docs/security/production-checklist.md).
# No add_header here: a location-level add_header would discard the server-level
# security headers (nginx add_header inheritance).
# ==============================================================================
location = /.well-known/security.txt {
  alias /etc/nginx/well-known/security.txt;
  types { }
  default_type "text/plain; charset=utf-8";
  limit_except GET { deny all; }
}

location = /security.txt {
  return 301 /.well-known/security.txt;
}
