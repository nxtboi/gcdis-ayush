# ==============================================================================
# Source-IP allow-list for the staff admin console (admin.gcdis.in).
# Included at server{} level inside the admin.gcdis.in block of nginx.conf, so it
# applies to every location on that host (pages, /_next/static, /_next/image,
# /.well-known/security.txt).
#
# STATUS: DISABLED. Every rule below is commented out, so everyone may reach the
# sign-in page (password + mandatory 2FA still apply). Leave it this way until the
# office / VPN egress ranges are confirmed (docs/security/production-checklist.md,
# "Admin IP allow-list go-live").
#
# ------------------------------------------------------------------------------
# HOW TO ENABLE (copy-paste)
# ------------------------------------------------------------------------------
# 1. Replace the example ranges in the block at the bottom of this file with your
#    real egress addresses (IPv4 and/or IPv6, single address or CIDR), remove the
#    leading "# " from each `allow` line and from `deny all;`. `deny all;` MUST be
#    the LAST rule (nginx evaluates allow/deny top-down, first match wins):
#
#        allow 203.0.113.0/24;
#        allow 198.51.100.17;
#        allow 2001:db8:1234::/48;
#        deny  all;
#
# 2. Put EXACTLY the same ranges into the API's ADMIN_IP_ALLOWLIST in .env
#    (comma-separated), because the staff console's browser calls go to
#    api.gcdis.in, which this file does not protect:
#
#        ADMIN_IP_ALLOWLIST="203.0.113.0/24, 198.51.100.17, 2001:db8:1234::/48"
#
#    The nginx rules gate the console pages; ADMIN_IP_ALLOWLIST gates staff sign-in
#    and every staff API token. Keeping the two lists identical avoids a console
#    that loads but cannot sign in (or the reverse).
#
# 3. Validate and apply (no downtime):
#
#        docker compose -f docker-compose.prod.yml exec proxy nginx -t
#        docker compose -f docker-compose.prod.yml exec proxy nginx -s reload
#        docker compose -f docker-compose.prod.yml up -d api     # picks up ADMIN_IP_ALLOWLIST
#
# 4. Verify from an allowed network (expect 200/307) and from a phone on mobile data
#    (expect 403 from nginx):
#
#        curl -sI https://admin.gcdis.in/ | head -1
#
# ROLLBACK: comment the lines out again, `nginx -s reload`, set ADMIN_IP_ALLOWLIST=""
# and `docker compose -f docker-compose.prod.yml up -d api`.
#
# Because nginx is the edge (no trusted upstream proxy), $remote_addr is the real
# client address and cannot be spoofed via X-Forwarded-For. If a CDN / load balancer
# is ever placed in front, these rules would see the CDN's address instead: add
# set_real_ip_from for the CDN's published ranges first (see nginx.conf).
# ==============================================================================

# allow 203.0.113.0/24;      # example: office egress range (RFC 5737 documentation range)
# allow 198.51.100.17;       # example: VPN gateway (RFC 5737 documentation address)
# allow 2001:db8:1234::/48;  # example: IPv6 office range (RFC 3849 documentation prefix)
# deny  all;                 # MUST stay last once any allow line is active
