# ------------------------------------------------------------------------------------------------
# Real visitor IP when Cloudflare proxies the site. DISABLED until Cloudflare is switched on.
#
# Enable (see docs/security/cdn-cloudflare.md, step 4):
#   1. Refresh the ranges below from https://www.cloudflare.com/ips-v4 and /ips-v6.
#   2. Uncomment every set_real_ip_from line and the real_ip_header line.
#   3. In nginx.conf, inside http { }, add:  include /etc/nginx/cloudflare-realip.conf;
#   4. nginx -t && nginx -s reload
#
# Only these ranges are trusted to supply CF-Connecting-IP. A request from anywhere else keeps its
# connecting address, so the header cannot be used to fake an IP. Rate limits, the admin allow-list and
# audit logs all key on the corrected $remote_addr.
# Ranges as published by Cloudflare (check for changes before enabling):
# ------------------------------------------------------------------------------------------------
# set_real_ip_from 173.245.48.0/20;
# set_real_ip_from 103.21.244.0/22;
# set_real_ip_from 103.22.200.0/22;
# set_real_ip_from 103.31.4.0/22;
# set_real_ip_from 141.101.64.0/18;
# set_real_ip_from 108.162.192.0/18;
# set_real_ip_from 190.93.240.0/20;
# set_real_ip_from 188.114.96.0/20;
# set_real_ip_from 197.234.240.0/22;
# set_real_ip_from 198.41.128.0/17;
# set_real_ip_from 162.158.0.0/15;
# set_real_ip_from 104.16.0.0/13;
# set_real_ip_from 104.24.0.0/14;
# set_real_ip_from 172.64.0.0/13;
# set_real_ip_from 131.0.72.0/22;
# set_real_ip_from 2400:cb00::/32;
# set_real_ip_from 2606:4700::/32;
