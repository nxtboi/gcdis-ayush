# ==============================================================================
# clamd configuration for the GCDIS `clamav` service (docker-compose.prod.yml).
# Mounted read-only over the image default (/etc/clamav/clamd.conf); the container
# root filesystem is read-only, so the image's CLAMD_CONF_* env overrides (which
# sed -i this file) are not used - edit this file instead.
# ==============================================================================
# Logs go to tmpfs; `docker logs gcdis-clamav` shows freshclam/clamd start-up.
LogFile /var/log/clamav/clamd.log
LogTime yes
LocalSocket /tmp/clamd.sock
# INSTREAM over TCP from the API (internal network only, never published)
TCPSocket 3310
TCPAddr 0.0.0.0
User clamav
# The API accepts uploads up to 25 MB, and the championship hero video (EVENT_VIDEO)
# up to UPLOAD_VIDEO_MAX_MB (default 60 MB); leave headroom so a maximum-size upload
# is scanned instead of rejected with "INSTREAM size limit exceeded" (which fails
# closed in production). Raise these together with UPLOAD_VIDEO_MAX_MB.
StreamMaxLength 70M
MaxFileSize 70M
MaxScanSize 200M
# Bound the work an archive bomb can cause
MaxRecursion 16
MaxFiles 10000
AlertExceedsMax yes
