
services:
  postgres:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    container_name: gcdis-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gcdis_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gcdis_secure_password_dev}
      POSTGRES_DB: ${POSTGRES_DB:-gcdis_db}
    # Only bind to localhost loopback for development; never expose to 0.0.0.0 host
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gcdis_admin} -d ${POSTGRES_DB:-gcdis_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - gcdis-internal

  redis:
    image: redis:8-alpine@sha256:0bf6577d7774e592b29d093e3ac9390eb91e13d72c21e506afce736de5e0eeb0
    container_name: gcdis-redis
    restart: unless-stopped
    # Only bind to localhost loopback for development; never expose to 0.0.0.0 host
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - gcdis-internal

networks:
  gcdis-internal:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
