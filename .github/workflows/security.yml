name: Security Analysis

# Static analysis and scheduled dependency auditing. Complements ci-cd.yml, which
# gates every push/PR on gitleaks, `npm audit --omit=dev --audit-level=high` and a
# Trivy scan of each built image.
#
# Actions are pinned to full commit SHAs (trailing comment = release); Dependabot
# keeps them current.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    # Mondays 03:30 UTC: catches advisories published after the last push
    - cron: '30 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  codeql:
    name: CodeQL (javascript-typescript)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Initialise CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended

      - name: Analyse
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: /language:javascript-typescript

  dependency-audit:
    name: Production dependency audit (high/critical)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Node.js 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      # Reads package-lock.json only; no install scripts are executed.
      - name: Fail on High+ Production Vulnerabilities
        run: npm audit --omit=dev --audit-level=high
