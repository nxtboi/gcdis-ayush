name: GCDIS Platform CI/CD Hardened Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Least privilege by default; jobs that need more request it explicitly.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  # GHCR image names must be lowercase
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}

# Every action is pinned to a full commit SHA (resolved with `git ls-remote` on
# 2026-10-12; the trailing comment names the release). Dependabot
# (.github/dependabot.yml) keeps the SHAs and comments up to date.
# Static analysis (CodeQL) and the scheduled dependency audit live in security.yml.

jobs:
  audit-and-scan:
    name: 1. Secret Scanning & Security Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js 20
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Fail on High+ Production Vulnerabilities
        run: npm audit --omit=dev --audit-level=high

  quality-and-tests:
    name: 2. Type Check All Workspaces & Real Test Execution
    needs: audit-and-scan
    runs-on: ubuntu-latest
    # Digest-pinned like docker-compose.prod.yml; keep both digests identical when
    # Dependabot bumps the compose file (tests/infra-hardening.spec.ts checks this).
    services:
      postgres:
        image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_USER: gcdis_ci
          POSTGRES_PASSWORD: ci_only_not_a_secret
          POSTGRES_DB: gcdis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gcdis_ci -d gcdis_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://gcdis_ci:ci_only_not_a_secret@localhost:5432/gcdis_test?schema=public
      REDIS_URL: redis://localhost:6379
      # CI-only dummy values (>= 32 chars) so config validation passes; not secrets.
      JWT_SECRET: ci_only_jwt_secret_value_not_used_in_production_0001
      JWT_REFRESH_SECRET: ci_only_jwt_refresh_value_not_used_in_production_02
      JWT_ADMIN_SECRET: ci_only_jwt_admin_value_not_used_in_production_0003
      COOKIE_SECRET: ci_only_cookie_secret_value_not_used_in_production_4
      TWO_FACTOR_ENCRYPTION_KEY: ci_only_2fa_key_value_not_used_in_production_00005
      PASS_SIGNING_SECRET: ci_only_pass_signing_value_not_used_in_production_6
      RAZORPAY_KEY_ID: rzp_test_ci_placeholder
      RAZORPAY_KEY_SECRET: ci_only_razorpay_placeholder
      RAZORPAY_WEBHOOK_SECRET: ci_only_razorpay_webhook_placeholder
      PUBLIC_SITE_URL: http://localhost:3000
      ADMIN_SITE_URL: http://localhost:3001
      STORAGE_DRIVER: local
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js 20
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Compile Shared Library
        run: npm run build --prefix packages/shared

      - name: Generate Prisma Client
        run: npx prisma generate --schema=apps/api/prisma/schema.prisma

      - name: Apply Database Migrations
        run: npx prisma migrate deploy --schema=apps/api/prisma/schema.prisma

      - name: Type-Check All Four Monorepo Workspaces
        run: |
          npm run type-check --prefix packages/shared
          npm run type-check --prefix apps/api
          npm run type-check --prefix apps/web
          npm run type-check --prefix apps/admin

      - name: Execute Real Integration & Acceptance Test Suites
        run: npx jest tests/ --runInBand

      - name: Validate Shell Scripts
        run: |
          for f in scripts/*.sh infra/*/*.sh; do bash -n "$f"; done

  build-scan-push:
    name: 3. Build, Scan (Trivy) & Push Images to GHCR
    needs: quality-and-tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: gcdis-api
            context: .
            publish: true
            dockerfile: apps/api/Dockerfile
            target: runner
          - name: gcdis-api-migrate
            context: .
            publish: true
            dockerfile: apps/api/Dockerfile
            target: builder
          - name: gcdis-web
            context: .
            publish: true
            dockerfile: apps/web/Dockerfile
            target: runner
          - name: gcdis-admin
            context: .
            publish: true
            dockerfile: apps/admin/Dockerfile
            target: runner
          # Host-built backup/restore image (scanned only, never pushed)
          - name: gcdis-backup
            context: infra/backup
            publish: false
            dockerfile: infra/backup/Dockerfile
            target: ''
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Normalise image prefix (lowercase)
        run: echo "IMAGE_PREFIX=${IMAGE_PREFIX,,}" >> "$GITHUB_ENV"

      # Emulation for building the arm64 images (Oracle Cloud Always Free runs on ARM)
      - name: Set up QEMU
        if: matrix.publish && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build ${{ matrix.name }} (local, for scanning)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          load: true
          push: false
          tags: ${{ env.IMAGE_PREFIX }}/${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      # Fails the build on any HIGH or CRITICAL vulnerability that has a fix available.
      # Accepted, documented exceptions go in infra/trivy/.trivyignore (with expiry).
      - name: Trivy vulnerability scan (fail on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_PREFIX }}/${{ matrix.name }}:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          trivyignores: infra/trivy/.trivyignore

      - name: Log in to GHCR
        if: matrix.publish && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push ${{ matrix.name }}
        if: matrix.publish && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          # Multi-architecture: Intel/AMD servers and ARM servers (Oracle Cloud Always Free) pull the same tag
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.name }}:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}/${{ matrix.name }}:latest
          cache-from: type=gha,scope=${{ matrix.name }}

  deploy:
    name: 4. SSH Deployment with Automated Rollback
    needs: build-scan-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
    steps:
      - name: Skip notice (deployment secrets not configured)
        if: env.DEPLOY_HOST == ''
        run: echo "::notice::DEPLOY_HOST secret not set - skipping production deployment."

      - name: Configure SSH
        if: env.DEPLOY_HOST != ''
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          # Host key MUST be pinned via secret (no blind ssh-keyscan trust-on-first-use)
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy release & verify health (rollback on failure)
        id: deploy
        if: env.DEPLOY_HOST != ''
        run: |
          IMAGE_PREFIX_LC="${IMAGE_PREFIX,,}"
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes -o BatchMode=yes \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "set -e; cd '${DEPLOY_PATH}' && git fetch --quiet origin main && git checkout --quiet --detach '${GITHUB_SHA}' && IMAGE_PREFIX='${IMAGE_PREFIX_LC}' IMAGE_TAG='${GITHUB_SHA}' sh scripts/deploy.sh"

      - name: Automated Rollback Report
        if: failure() && steps.deploy.outcome == 'failure'
        run: |
          echo "::error::Release ${GITHUB_SHA} failed health verification on the production host."
          echo "scripts/deploy.sh has redeployed the previous image tag recorded in .deploy/current-tag (see step log above)."

      - name: Clean up SSH material
        if: always()
        run: rm -rf ~/.ssh/id_deploy
